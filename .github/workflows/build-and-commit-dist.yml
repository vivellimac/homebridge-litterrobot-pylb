name: Build & Commit dist

on:
  push:
    branches:
      - main
      - api-hookup
      - feature/**
      - fix/**
      - hotfix/**
    paths:
      - "src/**"
      - "tsconfig.json"
      - "package.json"
      - ".eslintrc.*"
  pull_request:
    branches:
      - main
      - api-hookup
    paths:
      - "src/**"
      - "tsconfig.json"
      - "package.json"
      - ".eslintrc.*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Use Node 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Lint (no warnings)
        run: npm run lint --max-warnings=0

      - name: Type-check & build
        run: npm run build

      - name: Commit dist if changed
        uses: EndBug/add-and-commit@v9
        with:
          add: "dist"
          message: "ci: build dist [skip ci]"
          default_author: github_actions
          push: true
