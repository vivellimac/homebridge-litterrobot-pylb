name: Build & Commit dist

on:
  push:
    branches: [ main, api-hookup, feature/**, fix/**, hotfix/** ]
    paths:
      - "src/**"
      - "tsconfig.json"
      - "package.json"
      - ".eslintrc.*"
  pull_request:
    branches: [ main, api-hookup ]
    paths:
      - "src/**"
      - "tsconfig.json"
      - "package.json"
      - ".eslintrc.*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: build-dist-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Use Node 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps (ci or fallback)
        run: |
          npm ci || npm install

      - name: Lint (no warnings)
        run: npm run lint --max-warnings=0

      - name: Type-check & build
        run: npm run build

      - name: Rebase onto remote branch
        run: |
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Ensure we’re tracking the current branch and up to date
          git fetch origin ${{ github.ref_name }} || true
          if git rev-parse --verify "origin/${{ github.ref_name }}" >/dev/null 2>&1; then
            git rebase "origin/${{ github.ref_name }}" || (git rebase --abort && exit 1)
          fi

      - name: Commit dist if changed
        run: |
          # Force-add in case dist/ is in .gitignore
          git add -f dist
          if git diff --cached --quiet -- dist; then
            echo "No dist changes."
          else
            git commit -m "ci: build dist [skip ci]"
          fi

      - name: Push
        run: |
          # Normal push (no force) after rebase
          git push origin HEAD:${{ github.ref_name }}
