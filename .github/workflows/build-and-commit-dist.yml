name: Build & Commit dist

on:
  push:
    branches: [ main, api-hookup, feature/**, fix/**, hotfix/** ]
    paths:
      - "src/**"
      - "tsconfig.json"
      - "package.json"
      - ".eslintrc.*"
  pull_request:
    branches: [ main, api-hookup ]
    paths:
      - "src/**"
      - "tsconfig.json"
      - "package.json"
      - ".eslintrc.*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: build-dist-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Use Node 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps (ci or fallback)
        run: |
          npm ci || npm install

      - name: Lint (no warnings)
        run: npm run lint --max-warnings=0

      - name: Type-check & build
        run: npm run build

      - name: Git configure bot identity
        run: |
          git config user.name  "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Rebase onto remote branch (avoid non-fast-forward)
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git fetch origin "$BRANCH" || true
          if git rev-parse --verify "origin/$BRANCH" >/dev/null 2>&1; then
            git rebase "origin/$BRANCH" || (git rebase --abort && exit 1)
          fi

      - name: Commit dist if changed
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          # Force-add dist even if ignored
          git add -f dist
          # Only commit when there are staged changes in dist/
          if git diff --cached --quiet -- dist; then
            echo "No dist changes to commit."
          else
            git commit -m "ci: build dist [skip ci]"
          fi

      - name: Push (fast-forward)
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          # Push HEAD to the same branch name on origin
          git push origin HEAD:"$BRANCH"
