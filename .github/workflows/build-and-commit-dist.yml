name: Build and Commit dist

on:
  push:
    branches: ["**"]
    # Prevent re-triggering on dist-only commits
    paths-ignore:
      - "dist/**"
      - ".github/workflows/build-and-commit-dist.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-dist-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-dist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm i --no-audit --no-fund
          fi

      - name: Lint (optional, fails on warnings if you enforce that in config)
        run: |
          if npm run | grep -qE 'lint'; then
            npm run lint
          else
            echo "No lint script; skipping."
          fi

      - name: Build TypeScript to dist/
        run: |
          if npm run | grep -qE '^ *build'; then
            npm run build
          else
            echo "No build script found. Expected a script named 'build' (e.g. rimraf dist && tsc)."
            exit 1
          fi

      - name: Verify dist exists
        run: |
          test -d dist || (echo "dist/ not found after build" && exit 1)

      - name: Commit and push dist changes (if any)
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          # Stage only dist and any files you also want to refresh (README/license); adjust as needed
          git add -A dist

          if git diff --cached --quiet; then
            echo "No changes in dist/ to commit."
            exit 0
          fi

          # Helpful commit message with source SHA; [skip ci] prevents other CI from running if present
          COMMIT_MSG="chore(dist): build for ${GITHUB_SHA} [skip ci]"
          git commit -m "${COMMIT_MSG}"

          # Push back to the same branch
          git push origin "HEAD:${GITHUB_REF#refs/heads/}"

      - name: Summary
        if: always()
        run: |
          echo "Ref: $GITHUB_REF"
          echo "Actor: $GITHUB_ACTOR"
          echo "Done."
