name: Build & Commit dist

on:
  push:
    branches: [ main, api-hookup, feature/**, fix/**, hotfix/** ]
    paths:
      - "src/**"
      - "tsconfig.json"
      - "package.json"
      - ".eslintrc.*"
  pull_request:
    branches: [ main, api-hookup ]
    paths:
      - "src/**"
      - "tsconfig.json"
      - "package.json"
      - ".eslintrc.*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout (full history on the correct ref)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}            # be on the actual branch, not detached
          persist-credentials: true

      - name: Determine target branch name
        id: branch
        run: |
          # PRs use GITHUB_HEAD_REF; pushes use GITHUB_REF_NAME
          BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Sync with remote (rebase)
        run: |
          git config pull.rebase true
          git fetch origin "${{ steps.branch.outputs.branch }}"
          git checkout "${{ steps.branch.outputs.branch }}"
          git pull --rebase origin "${{ steps.branch.outputs.branch }}"

      - name: Use Node 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps (ci or fallback)
        run: npm ci || npm install

      - name: Lint (no warnings)
        run: npm run lint --max-warnings=0

      - name: Type-check & build
        run: npm run build

      # Only commit/push back on branch pushes (never on PRs)
      - name: Commit dist (if changed)
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          git config user.name  "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # force-add dist even if ignored
          git add -f dist

          # no-op if nothing staged
          if git diff --cached --quiet; then
            echo "No changes in dist; nothing to commit."
            exit 0
          fi

          git commit -m "ci: build dist [skip ci]"

          # Rebase again to avoid late race, then push with lease
          git fetch origin "${{ steps.branch.outputs.branch }}"
          git pull --rebase origin "${{ steps.branch.outputs.branch }}"

          # Safe force to handle non-FF only if nothing else changed since fetch
          git push --force-with-lease origin HEAD:"${{ steps.branch.outputs.branch }}"
