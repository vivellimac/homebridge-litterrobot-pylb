name: Build and Commit dist

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "dist/**"
      - ".github/workflows/build-and-commit-dist.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-dist-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-dist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Remove lockfile (we do not track it)
        run: rm -f package-lock.json

      - name: Install deps (no lockfile)
        run: npm i --no-audit --no-fund

      - name: Lint
        run: |
          if npm run | grep -qE '(^|[[:space:]])lint([[:space:]]|:)'; then
            npm run lint -- --max-warnings=0
          else
            echo "No lint script; skipping."
          fi

      - name: Build TypeScript to dist/
        run: |
          if npm run | grep -qE '(^|[[:space:]])build([[:space:]]|:)'; then
            npm run build
          else
            echo "Missing 'build' script (e.g. \"rimraf dist && tsc\")." && exit 1
          fi

      - name: Verify dist exists
        run: test -d dist || (echo "dist/ not found after build" && exit 1)

      - name: Commit and push dist changes
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          git add -A dist
          if git diff --cached --quiet; then
            echo "No changes in dist/ to commit."
            exit 0
          fi
          git commit -m "chore(dist): rebuild for ${GITHUB_SHA} [skip ci]"
          git push origin "HEAD:${GITHUB_REF#refs/heads/}"

      - name: Summary
        run: |
          echo "Ref: $GITHUB_REF"
          echo "Done."
